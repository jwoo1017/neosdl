# /etc/nginx/sites-available/neosdl — finble-server 에 실제로 설치된 설정의 원본.
# 로컬의 Vite dev 프록시(frontend/vite.config.js)와 같은 규칙이다.
#   http(80)          → 전부 https 로 301
#   /api/*            → backend(127.0.0.1:8000, systemd) — REST + WebSocket + SSE
#   /config, /healthz → backend (루트에 남은 두 라우트, app/main.py)
#   그 외              → /var/www/neosdl 의 SPA(index.html)
# 인증서는 사내 발급(/etc/ssl/{certs,private}/intranet.finble.internal.*) — 직원 PC 에
# 발급 CA(또는 자체 서명 인증서)를 신뢰 루트로 설치해야 브라우저 경고가 없다.
# 바꾼 뒤: sudo cp deploy/nginx/neosdl.conf /etc/nginx/sites-available/neosdl && sudo nginx -t && sudo systemctl reload nginx

# 로그인·가입·비밀번호 찾기 요청 폭주(무차별 대입) 방어 — IP 당 분당 20회, 순간 10회까지 허용.
# 계정 단위 잠금(연속 5회 실패 → 15분)은 앱이 한다(app/github_oauth.py login). 둘은 막는 대상이 다르다:
# 이건 한 IP 가 여러 계정을 두드리는 것, 앱 잠금은 여러 IP 가 한 계정을 두드리는 것.
limit_req_zone $binary_remote_addr zone=neosdl_auth:10m rate=20r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 10.0.0.5:80;
    server_name intranet.finble.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 10.0.0.5:443 ssl;
    http2 on;
    server_name intranet.finble.internal;

    ssl_certificate     /etc/ssl/certs/intranet.finble.internal.crt;
    ssl_certificate_key /etc/ssl/private/intranet.finble.internal.key;

    root /var/www/neosdl;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /config {
        proxy_pass http://127.0.0.1:8000/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        limit_req zone=neosdl_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 끝에 / 를 붙이지 말 것 — 붙이면 /api 접두어가 잘려 백엔드 라우트(/api/...)와 어긋난다.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
