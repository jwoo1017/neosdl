# /etc/nginx/sites-available/neosdl — finble-server 에 실제로 설치된 설정의 원본.
# 로컬의 Vite dev 프록시(frontend/vite.config.js)와 같은 규칙이다.
#   /api/*            → backend(127.0.0.1:8000, systemd) — REST + WebSocket + SSE
#   /config, /healthz → backend (루트에 남은 두 라우트, app/main.py)
#   그 외              → /var/www/neosdl 의 SPA(index.html)
# 바꾼 뒤: sudo cp deploy/nginx/neosdl.conf /etc/nginx/sites-available/neosdl && sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 10.0.0.5:80;
    server_name intranet.finble.internal;

    root /var/www/neosdl;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /config {
        proxy_pass http://127.0.0.1:8000/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        # 끝에 / 를 붙이지 말 것 — 붙이면 /api 접두어가 잘려 백엔드 라우트(/api/...)와 어긋난다.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
