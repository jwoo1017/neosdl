<svg width="667" height="728" viewBox="0 0 667 728" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.eye{transform-box:fill-box;transform-origin:50% 100%;animation:blink 5.4s infinite}
.brow{transform-box:fill-box;transform-origin:50% 0%;animation:browDrop 5.4s infinite}
.r{animation-delay:.03s}
@keyframes blink{
  0%,85.2%{transform:scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,.45)}
  87%{transform:scaleY(.16)}
  87.8%{transform:scaleY(.16);animation-timing-function:cubic-bezier(0,.55,.4,1)}
  90.7%,93.3%{transform:scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,.45)}
  95%{transform:scaleY(.16)}
  95.6%{transform:scaleY(.16);animation-timing-function:cubic-bezier(0,.55,.4,1)}
  98.3%,100%{transform:scaleY(1)}
}
@keyframes browDrop{
  0%,85.6%{transform:translateY(0) scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,.45)}
  87.4%{transform:translateY(14px) scaleY(.94)}
  88.2%{transform:translateY(14px) scaleY(.94);animation-timing-function:cubic-bezier(0,.55,.4,1)}
  90.6%{transform:translateY(-2.5px) scaleY(1.01)}
  91.4%,93.7%{transform:translateY(0) scaleY(1);animation-timing-function:cubic-bezier(.4,0,1,.45)}
  95.4%{transform:translateY(14px) scaleY(.94)}
  96%{transform:translateY(14px) scaleY(.94);animation-timing-function:cubic-bezier(0,.55,.4,1)}
  98.4%{transform:translateY(-2.5px) scaleY(1.01)}
  99.2%,100%{transform:translateY(0) scaleY(1)}
}
@media (prefers-reduced-motion:reduce){.eye,.brow{animation:none}}
</style>
